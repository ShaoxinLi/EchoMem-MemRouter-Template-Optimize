schema_version: "mem-router.backend-route-template.v1"
template_id: "openviking.preference_profile.v1"
version: "1.0"
status: "enabled"
target:
  primary_backend_id: "openviking_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "preference_profile"
  description: "User asks about their own preferences, habits, lifestyle choices, personal profile, or subjective experiences."
semantic_card: >-
  Use this template when the query is about what the user likes, prefers, routinely does, or how they describe themselves. This includes habits, lifestyle, personal background, ethnicity, stressors, coping mechanisms, time-management techniques, and any question that seeks a subjective or profile-oriented answer. It does NOT cover structured relations between entities, temporal ordering, or system dependency queries.
query_prototypes:
  - "What preference does PERSON_A have?"
  - "What does PERSON_A prefer?"
  - "What habit does PERSON_A have?"
  - "What does PERSON_A usually do?"
  - "What is PERSON_A's lifestyle like?"
  - "What is PERSON_A's background?"
  - "What personal attribute does PERSON_A identify with?"
  - "What is PERSON_A's biggest stressor?"
  - "How does PERSON_A prefer to work?"
  - "What does PERSON_A do during ACTIVITY_X?"
  - "What time-management technique does PERSON_A use?"
  - "What is PERSON_A's favorite way to do ACTIVITY_X?"
  - "What does PERSON_A enjoy doing?"
  - "What is PERSON_A's daily routine?"
  - "What is PERSON_A's personal style?"
  - "How does PERSON_A prefer to communicate?"
  - "How does PERSON_A like reports formatted?"
  - "What kind of music does PERSON_A prefer?"
  - "What coping mechanism does PERSON_A use for STRESSOR_X?"
  - "How does PERSON_A handle pressure at work?"
  - "What is PERSON_A's preferred way to relax?"
  - "What time does PERSON_A usually exercise?"
  - "What workout schedule does PERSON_A usually follow?"
  - "Why does PERSON_A delay ROUTINE_X?"
  - "What motivates PERSON_A to do ACTIVITY_X?"
  - "What other interests does PERSON_A have besides ACTIVITY_X?"
  - "What short-term fitness goal does PERSON_A have?"
  - "What does PERSON_A want to achieve in ROLE_X?"
  - "What fitness habits support PERSON_A's athletic goals?"
hard_negatives:
  - query: "Which purchase did PERSON_A make in MONTH_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single purchase fact, not preference profile."
  - query: "What was the origin of PERSON_A's PET_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single origin fact, not preference profile."
  - query: "At what time did PERSON_A attend EVENT_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Single temporal fact, not preference profile."
  - query: "What was the day gap between PURCHASE_X and EVENT_Y?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration comparison, not preference profile."
  - query: "Which relationship links PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Relation query, not preference profile."
  - query: "What technical cause produced SYSTEM_FAILURE_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal query, not preference profile."
  - query: "What is the total cost of ITEM_A and ITEM_B?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Arithmetic over facts, not preference profile."
  - query: "Which API path starts REQUEST_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System dependency query, not preference profile."
  - query: "Can you recall what you recommended before?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Previous chat recall, not preference profile."
  - query: "What kind of tattoo does PERSON_A have?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single personal fact, not preference profile."
query_spec:
  search_mode: "search"
  openviking:
    context_type: "memory"
    target_uri: "viking://memories/preferences"
    skip_intent_analysis: true
    typed_query_template:
      intent: "preference_profile"
      priority: 1
      target_directories: null
thresholds:
  accept: 0.65
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 29
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
