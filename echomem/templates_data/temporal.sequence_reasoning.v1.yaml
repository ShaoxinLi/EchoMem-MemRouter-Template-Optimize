schema_version: "mem-router.backend-route-template.v1"
template_id: "temporal.sequence_reasoning.v1"
version: "1.0"
status: "enabled"
target:
  primary_backend_id: "temporal_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "temporal_sequence_reasoning"
  description: "Queries asking for event ordering, first/last occurrence, or relative sequence across remembered events."
semantic_card: >-
  Use this template only when the query asks which of two or more remembered events happened first, happened last, came before another event, or what the order of events was. Temporal ordering must be the core answer need. It is NOT for structured relation traversal, preference queries, or single timestamp lookups.
query_prototypes:
  - "Which event happened first?"
  - "Which event happened last?"
  - "What happened first, EVENT_A or EVENT_B?"
  - "What happened earlier, EVENT_A or EVENT_B?"
  - "Which came first, EVENT_A or EVENT_B?"
  - "Which came later, EVENT_A or EVENT_B?"
  - "Which action did PERSON_A do first, ACTION_A or ACTION_B?"
  - "Which task did PERSON_A complete first?"
  - "Which trip did PERSON_A take first?"
  - "Which device did PERSON_A set up first?"
  - "Which pet did PERSON_A adopt first?"
  - "Which person became a parent first?"
  - "What is the order of EVENT_SET_X?"
  - "Put EVENT_SET_X in chronological order."
  - "Did EVENT_A happen before EVENT_B?"
  - "Did EVENT_A happen after EVENT_B?"
  - "Was EVENT_A earlier than EVENT_B?"
  - "Was EVENT_A later than EVENT_B?"
  - "Which event happened most recently?"
  - "Which was the earliest remembered event?"
  - "Which remembered task came before EVENT_X?"
  - "Which remembered activity happened most recently?"
  - "Order EVENT_A, EVENT_B, and EVENT_C."
  - "Which of EVENT_A and EVENT_B occurred first?"
  - "Which event came immediately after EVENT_X?"
hard_negatives:
  - query: "At what time did PERSON_A start ACTIVITY_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Timestamp lookup, not ordering across events."
  - query: "Which place was PERSON_A at on DATE_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Date-constrained fact lookup, not sequence reasoning."
  - query: "What was the day interval between EVENT_A and EVENT_B?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration calculation, not first/last ordering."
  - query: "How many weeks ago did EVENT_X happen?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Elapsed-time question, not ordering."
  - query: "Which relation connects PERSON_A to PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation query, not temporal sequence."
  - query: "Which field coordinates SYSTEM_A and SYSTEM_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Technical dependency graph, not event order."
  - query: "Which technical issue caused SYSTEM_FAILURE_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal graph query, not temporal order."
  - query: "Which books did PERSON_A finish reading?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact lookup, not ordering."
  - query: "Which purchased items belong to PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact list, not event sequence."
  - query: "Which identity attribute belongs to PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Profile fact, not temporal sequence."
thresholds:
  accept: 0.66
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 25
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
