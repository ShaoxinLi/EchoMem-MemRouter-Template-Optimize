schema_version: "mem-router.backend-route-template.v1"
template_id: "temporal.duration_comparison.v1"
version: "2.0"
status: "enabled"
target:
  primary_backend_id: "temporal_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "duration_comparison"
  description: "Queries requiring elapsed-time calculation, duration comparison, or distance between two remembered events."
semantic_card: >-
  Use this template when the query asks how much time passed, how long something lasted, or how many hours/days/weeks/months/years were involved. Covers both elapsed time between two remembered events and personal task durations where time itself is the core answer.
query_prototypes:
  - "How many days ago did EVENT_X happen?"
  - "How many weeks ago did PERSON_A start using TOOL_X?"
  - "How many months have passed since EVENT_X?"
  - "How many years ago did PERSON_A do ACTION_X?"
  - "How long ago did PERSON_A start ACTIVITY_X?"
  - "How long did PERSON_A and PERSON_B date before EVENT_X?"
  - "How long did STATE_X last?"
  - "How many days passed between MILESTONE_X and MILESTONE_Y?"
  - "How many weeks passed between EVENT_A and EVENT_B?"
  - "How many months passed between EVENT_A and EVENT_B?"
  - "How many days had passed since EVENT_A when EVENT_B happened?"
  - "How many weeks had passed since EVENT_A when EVENT_B happened?"
  - "How many months before EVENT_B did EVENT_A happen?"
  - "How many days before PURCHASE_X did EVENT_Y happen?"
  - "How many weeks after EVENT_A did EVENT_B happen?"
  - "How far apart were EVENT_A and EVENT_B?"
  - "What was the time gap between EVENT_A and EVENT_B?"
  - "What was the interval between EVENT_A and EVENT_B?"
  - "How much time passed from EVENT_A to EVENT_B?"
  - "How long after joining GROUP_X did PERSON_A complete TASK_X?"
  - "How long did it take PERSON_A to finish TASK_X?"
  - "How many hours did PERSON_A spend on ACTIVITY_X?"
  - "How long did PERSON_A wait for DECISION_X?"
  - "How much time has passed since EVENT_X?"
  - "How long was it from DATE_X to EVENT_Y?"
  - "How many days passed between EVENT_A and EVENT_B?"
  - "How long before EVENT_X did EVENT_Y occur?"
  - "How long after EVENT_X did EVENT_Y occur?"
  - "How many hours did PERSON_A spend practicing ACTIVITY_X this week?"
  - "How long did PERSON_A spend learning SKILL_X?"
hard_negatives:
  - query: "On what date did PERSON_A buy ITEM_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Timestamp lookup, not elapsed-time calculation."
  - query: "What location was PERSON_A at on DATE_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Date-constrained fact lookup, not duration comparison."
  - query: "Which remembered event was earliest?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Ordering query, not duration calculation."
  - query: "What sequence do the events in EVENT_SET_X follow?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Sequence reasoning, not elapsed-time calculation."
  - query: "Which books are in PERSON_A's reading history?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact lookup, not duration comparison."
  - query: "Which item purchase happened during MONTH_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Time-filtered personal fact, not duration calculation."
  - query: "How many ITEM_X did PERSON_A collect?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Quantity fact, not elapsed-time calculation."
  - query: "How are PERSON_A and PERSON_B related?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation, not duration comparison."
  - query: "What root cause explains SYSTEM_FAILURE_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal graph query, not duration comparison."
  - query: "Which field aligns SYSTEM_A with SYSTEM_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Technical dependency graph, not time interval."
thresholds:
  accept: 0.66
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 30
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
