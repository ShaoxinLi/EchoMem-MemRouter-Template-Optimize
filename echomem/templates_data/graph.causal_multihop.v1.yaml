schema_version: "mem-router.backend-route-template.v1"
template_id: "graph.causal_multihop.v1"
version: "2.0"
status: "enabled"
target:
  primary_backend_id: "graph_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "causal_multihop"
  description: "Queries asking for causal chains, dependencies, blockers, root causes, or multi-hop reasoning across linked events/entities."
semantic_card: >-
  Use this template when a query asks why something happened, what caused a result, what prevents a behavior, what should trigger a downstream action, or how one event/system/entity leads to another through one or more links.
query_prototypes:
  - "What caused OUTCOME_X?"
  - "Why did EVENT_X happen?"
  - "What led to RESULT_X?"
  - "What prevents ACTION_X from succeeding?"
  - "What triggered EVENT_X?"
  - "What should CONDITION_X trigger?"
  - "What dependency caused FAILURE_X?"
  - "Which upstream event caused ISSUE_X?"
  - "Which rule caused RESULT_X?"
  - "What root cause links EVENT_A to EVENT_B?"
  - "What chain of events produced OUTCOME_X?"
  - "Which intermediate entity connects CAUSE_X and EFFECT_X?"
  - "How does STATE_A lead to STATE_B?"
  - "Why can METRIC_X look healthy while ISSUE_X exists?"
  - "What explains the mismatch between SIGNAL_X and RESULT_X?"
  - "How do linked facts imply CONCLUSION_X?"
  - "Which path connects SYMPTOM_X to CAUSE_Y?"
  - "Which evidence chain supports CONCLUSION_X?"
  - "What caused ENTITY_A and ENTITY_B to diverge?"
  - "How does SIGNAL_X affect RESULT_X?"
  - "What rule connects INPUT_X to OUTPUT_X?"
  - "Why did ACTION_X produce EFFECT_X?"
  - "Which condition explains why OUTCOME_X occurred?"
  - "How did EVENT_A contribute to EVENT_B?"
  - "What prevents RESULT_X despite CONDITION_Y?"
  - "Why did the expected downstream state fail to appear?"
  - "Which upstream dependency explains the final result?"
  - "How did multiple linked events lead to RESULT_X?"
  - "What causal link explains BEHAVIOR_X?"
  - "Why did SYSTEM_X produce unexpected RESULT_X?"
hard_negatives:
  - query: "Which remembered event occurred earliest?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Temporal ordering, not causal reasoning."
  - query: "How much time passed between EVENT_A and EVENT_B?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration comparison, not causal reasoning."
  - query: "At what time did PERSON_A perform ACTION_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Timestamp lookup, not causal chain."
  - query: "What personal goal does PERSON_A have?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal semantic fact, not causal graph reasoning."
  - query: "What item did PERSON_A buy?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single personal fact, not causal chain."
  - query: "Can you recall what we discussed earlier?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Previous conversation recall, not causal reasoning."
  - query: "Which social relation links PERSON_A with PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation traversal, not causal multihop."
  - query: "Which organization is PERSON_A a member of?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Membership relation, not causal chain."
  - query: "Which synchronization field links SYSTEM_A to SYSTEM_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System dependency query, not causal multihop."
  - query: "Which identifier should every record contain?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Schema dependency lookup, not causal reasoning."
thresholds:
  accept: 0.66
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 30
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
