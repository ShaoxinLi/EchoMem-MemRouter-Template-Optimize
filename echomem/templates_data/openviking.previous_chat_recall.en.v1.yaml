schema_version: "mem-router.backend-route-template.v1"
template_id: "openviking.previous_chat_recall.en.v1"
version: "1.0"
status: "enabled"
target:
  primary_backend_id: "openviking_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "previous_chat_recall"
  description: "User asks MemRouter/OpenViking to recall something mentioned, recommended, configured, or discussed in a previous conversation."
semantic_card: >-
  Use this template when the query explicitly references a previous conversation, prior recommendation, earlier instruction, remembered preference, or something the assistant previously said. This template is routed to OpenViking because it depends on general conversational memory rather than graph relations or temporal sequence stores.
query_prototypes:
  - "Remind me what you recommended before."
  - "What did you suggest in our previous conversation?"
  - "What did we discuss last time?"
  - "Can you recall what I asked earlier?"
  - "What did I tell you before?"
  - "What did you say I should use?"
  - "Do you remember the option you recommended?"
  - "Can you remind me of the detail from our earlier chat?"
  - "I am looking back at our previous conversation."
  - "I am returning to something we discussed earlier."
  - "Can you remind me what ITEM_X you recommended for TASK_X?"
  - "What option did you specifically recommend?"
  - "Which ITEM_X did you suggest for PROJECT_X?"
  - "What setting did you tell me to use for WORKFLOW_X?"
  - "What was the recommendation from our previous chat about TOPIC_X?"
  - "What did you recommend when we talked about TOPIC_X?"
  - "Can you remind me what ITEM_X you suggested?"
  - "What did you say was best for ACTIVITY_X last time?"
  - "What option did you recommend for TOPIC_X before?"
  - "What detail from the earlier conversation should I use now?"
hard_negatives:
  - query: "On what date did PERSON_A attend EVENT_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Timeline fact, not previous chat recall."
  - query: "Which prior event occurred earliest?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Temporal ordering, not previous chat recall."
  - query: "What was PERSON_A's waiting duration for DECISION_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration lookup, not previous chat recall."
  - query: "What relation exists between PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation query, not previous chat recall."
  - query: "Which book was PERSON_A reading during EVENT_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact lookup, not previous chat recall."
  - query: "Which cause explains SYSTEM_FAILURE_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal dependency query, not previous chat recall."
  - query: "Which endpoint begins REQUEST_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System dependency query, not previous chat recall."
  - query: "What is PERSON_A's usual exercise time?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Routine profile query, not previous chat recall."
  - query: "Can you suggest recipes for TIME_PERIOD_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Recommendation request, not previous chat recall."
  - query: "What goal does PERSON_A have for SPORT_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Profile query, not previous chat recall."
query_spec:
  search_mode: "search"
  openviking:
    context_type: "memory"
    target_uri: "viking://memories"
    skip_intent_analysis: true
    typed_query_template:
      intent: "previous_chat_recall"
      priority: 1
      target_directories: null
thresholds:
  accept: 0.65
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 20
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
