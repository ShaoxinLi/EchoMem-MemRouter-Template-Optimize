schema_version: "mem-router.backend-route-template.v1"
template_id: "openviking.personal_fact_lookup.en.v2"
version: "2.1"
status: "enabled"
target:
  primary_backend_id: "openviking_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "personal_fact_lookup"
  description: "User asks for a specific fact, object, item, place, status, or attribute about themselves or a known person."
semantic_card: >-
  Use this template when the query asks for a specific personal fact, attribute, status, or detail about someone: what they own, what they do, their health, their identity, their interests, their possessions, or factual details from their life. This includes both subjective experiences (how they felt) and objective facts (what car they drive, what books they read, what they collect). Does NOT cover structured person-entity/person-event relations, temporal durations, or preference/habit queries (those go to graph or preference_profile).
query_prototypes:
  - "What personal fact is known about PERSON_A?"
  - "How does PERSON_A describe EXPERIENCE_X?"
  - "What memory stands out from PERSON_A's EXPERIENCE_X?"
  - "What challenge did PERSON_A face?"
  - "What accomplishment is PERSON_A proud of?"
  - "What personal goal is PERSON_A working toward?"
  - "What obstacle did PERSON_A overcome?"
  - "What lesson did PERSON_A learn from EXPERIENCE_X?"
  - "How did PERSON_A feel during EVENT_X?"
  - "What kind of ITEM_X does PERSON_A have?"
  - "What items has PERSON_A bought?"
  - "What books has PERSON_A read?"
  - "What does PERSON_A collect?"
  - "What health issues does PERSON_A have?"
  - "What identity attribute is known about PERSON_A?"
  - "What field of study would PERSON_A pursue?"
  - "What topic did PERSON_A research?"
  - "What pets does PERSON_A have?"
  - "What hobbies does PERSON_A have?"
  - "What places has PERSON_A visited?"
  - "What activities has PERSON_A pursued?"
  - "What support does PERSON_A have?"
  - "What career goal does PERSON_A have?"
  - "What object did PERSON_A break?"
  - "How many ITEM_X has PERSON_A owned?"
  - "Which hobby did PERSON_A take up?"
  - "What kind of project has PERSON_A worked on?"
  - "Which family members or friends has PERSON_A mentioned?"
  - "What kind of vehicle does PERSON_A drive?"
  - "What personal event did PERSON_A announce?"
  - "What kind of online group did PERSON_A join?"
  - "What did PERSON_A receive from RELATIVE_X?"
  - "What photo did PERSON_A share?"
  - "What recipe did PERSON_A mention?"
  - "Where did PERSON_A grow up?"
  - "What personal milestone did PERSON_A mention?"
  - "What did PERSON_A eat for MEAL_X?"
  - "What did PERSON_A say about ACTIVITY_X?"
  - "What personal object is associated with PERSON_A?"
  - "What personal achievement did PERSON_A mention?"
hard_negatives:
  - query: "At what time did PERSON_A visit PLACE_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Temporal lookup, not personal fact lookup."
  - query: "Which remembered event occurred first?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Temporal ordering, not personal fact lookup."
  - query: "What was the month gap between EVENT_A and EVENT_B?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration comparison, not personal fact lookup."
  - query: "Which connection exists between PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation query, not single-person fact lookup."
  - query: "Who are PERSON_A's friends?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Relation list, not single-person fact lookup."
  - query: "Which organization includes PERSON_A?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Membership relation, not personal fact lookup."
  - query: "Which common trait links PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Shared relation query, not single-person fact lookup."
  - query: "Which shared interests connect PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Two-person shared-interest relation, not personal fact lookup."
  - query: "Why did SYSTEM_FAILURE_X occur?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System causal query, not personal fact lookup."
  - query: "Which field keeps SYSTEM_A and SYSTEM_B synchronized?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Technical dependency query, not personal fact lookup."
  - query: "Can you suggest activities based on PREFERENCE_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Recommendation or aggregation request, not single fact lookup."
  - query: "What did you recommend in our previous chat about TOPIC_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Previous chat recall, not personal fact lookup."
query_spec:
  search_mode: "search"
  openviking:
    context_type: "memory"
    target_uri: "viking://memories"
    skip_intent_analysis: true
    typed_query_template:
      intent: "personal_fact_lookup"
      priority: 1
      target_directories: null
thresholds:
  accept: 0.56
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 40
  min_hard_negatives: 12
  expected_fallback_rate: 0.15
