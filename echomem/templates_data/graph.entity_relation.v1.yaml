schema_version: "mem-router.backend-route-template.v1"
template_id: "graph.entity_relation.v1"
version: "2.1"
status: "enabled"
target:
  primary_backend_id: "graph_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "entity_relation_query"
  description: "Queries asking how entities, people, organizations, events, or objects are connected."
semantic_card: >-
  Use this template when the user asks about explicit relationships, connections, membership, collaboration, co-participation, discussion links, or entity-to-event associations. Covers all structured relations including person-event, person-entity, event-location, and entity-attribute links. The query usually contains at least two entities or asks for connected entities around one anchor entity.
query_prototypes:
  - "What is the relationship between PERSON_A and PERSON_B?"
  - "How are ENTITY_A and ENTITY_B connected?"
  - "How is PERSON_A connected to PERSON_B?"
  - "What connection exists between ENTITY_A and ENTITY_B?"
  - "Who is connected to PERSON_A?"
  - "Who is related to ENTITY_A?"
  - "Which people are associated with PERSON_A?"
  - "Which organization does PERSON_A belong to?"
  - "Which group is ENTITY_A part of?"
  - "Who worked with PERSON_A?"
  - "Who collaborated with PERSON_A?"
  - "Who attended EVENT_X with PERSON_A?"
  - "Which events did PERSON_A and PERSON_B both attend?"
  - "What did PERSON_A discuss with PERSON_B?"
  - "What topic connected PERSON_A and PERSON_B?"
  - "What event connects PERSON_A and CAUSE_X?"
  - "Which event did PERSON_A participate in to support CAUSE_X?"
  - "Who supported the same cause as PERSON_A?"
  - "Which entity is linked to EVENT_X?"
  - "Which person is linked to ACTIVITY_X?"
  - "What shared activity connects PERSON_A and PERSON_B?"
  - "Which team is PERSON_A part of?"
  - "Who invited PERSON_B to join ACTIVITY_X?"
  - "Which person invited another person to EVENT_X?"
  - "What social connection led to INVITATION_X?"
  - "Who proposed ACTIVITY_X to PERSON_B?"
  - "Which person reached out to another person for EVENT_X?"
  - "Who planned to include PERSON_B in GROUP_X?"
  - "Which friendship led to ACTIVITY_INVITATION_X?"
  - "What relationship explains JOINT_ACTIVITY_X?"
  - "What do PERSON_A and PERSON_B have in common?"
  - "How do PERSON_A and PERSON_B both like to destress?"
  - "What type of volunteering have PERSON_A and PERSON_B both done?"
  - "Which places or events have PERSON_A and PERSON_B planned to meet at?"
  - "Which place did PERSON_A and PERSON_B plan to meet in?"
  - "Do PERSON_A and PERSON_B both have pets?"
  - "What kind of interests do PERSON_A and PERSON_B share?"
  - "Who did PERSON_A have dinner with on DATE_X?"
  - "What did PERSON_A share with PERSON_B?"
  - "What did PERSON_A and PERSON_B discover they both enjoy?"
hard_negatives:
  - query: "On what date did PERSON_A visit PLACE_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Timestamp lookup, not relation traversal."
  - query: "Which remembered event happened first?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Sequence reasoning, not entity relation."
  - query: "How many days passed between two remembered events?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration comparison, not entity relation."
  - query: "What is PERSON_A's favorite communication style?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "User preference memory, not relation query."
  - query: "Where did PERSON_A travel on DATE_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single-person location fact, not relation query."
  - query: "Can you recommend activities based on PREFERENCE_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Preference-driven recommendation, not graph relation."
  - query: "What item did PERSON_A buy in MONTH_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single-person purchase fact, not relation traversal."
  - query: "Which books has PERSON_A read?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single-person interest list, not relation traversal."
  - query: "Which career objective belongs to PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal profile fact, not relation traversal."
  - query: "Which technical rule blocks repeated processing?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System dependency query, not entity relation."
thresholds:
  accept: 0.5
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.08
calibration:
  min_positive_examples: 40
  min_hard_negatives: 10
  expected_fallback_rate: 0.3
