schema_version: "mem-router.backend-route-template.v1"
template_id: "openviking.aggregation_summary.v2"
version: "2.0"
status: "enabled"
target:
  primary_backend_id: "openviking_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "aggregation_summary"
  description: "User asks for aggregation, comparison, summary, or list across multiple memory fragments."
semantic_card: >-
  Use this template when the query requires combining, comparing, or summarizing multiple subjective memory pieces (preferences, habits, experiences) rather than retrieving a single concrete fact or structured relation. Signals include: compare preferences, overall trend, common themes, suggestions based on accumulated context, or summary of subjective experiences. Does NOT cover entity-attribute totals, person-event lists, or pure temporal durations.
query_prototypes:
  - "Compare PERSON_A's preferences across OPTION_SET_X."
  - "Summarize PERSON_A's experiences with TOPIC_X."
  - "What is the overall trend across MEMORY_SET_X?"
  - "Which option is better based on MEMORY_SET_X?"
  - "What are the common themes across MEMORY_SET_X?"
  - "What is the combined result across EVENT_SET_X?"
  - "Would PERSON_A prefer OPTION_A or OPTION_B?"
  - "Can you suggest ACTIVITY_X options based on PREFERENCE_SET_X?"
  - "What is the overall METRIC_X across EVENT_SET_X?"
  - "Which OPTION_X is better based on MEMORY_SET_X?"
  - "What are the common attributes in COLLECTION_X?"
  - "Compare BEHAVIOR_SET_X across CATEGORY_SET_X."
  - "Suggest weekend activities that fit INTEREST_SET_X."
  - "What factors influenced PERSON_A's career choice overall?"
  - "Can you suggest new recipes based on PREFERENCE_SET_X?"
  - "What recipes should PERSON_A try for TIME_PERIOD_X?"
  - "Can you recommend events based on INTEREST_SET_X?"
  - "What other exercises can help with GOAL_X?"
  - "Which activities would improve PERFORMANCE_X?"
  - "What should PERSON_A try next based on MEMORY_SET_X?"
  - "What patterns appear across PERSON_A's recent activities?"
  - "What themes recur in PERSON_A's personal memories?"
  - "Which recommendation best matches PERSON_A's past choices?"
  - "What summary describes PERSON_A's preferences over time?"
  - "What activities should PERSON_A try based on personal goals?"
hard_negatives:
  - query: "Which item did PERSON_A purchase during MONTH_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single purchase fact, not aggregation."
  - query: "Where did PERSON_A get PET_X from?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single origin fact, not aggregation."
  - query: "When did PERSON_A visit EVENT_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Single temporal fact, not aggregation."
  - query: "How many days passed between PURCHASE_X and EVENT_Y?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration comparison, not aggregation."
  - query: "Which direct relation links PERSON_A with PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Relation query, not aggregation."
  - query: "What caused SYSTEM_FAILURE_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal query, not aggregation."
  - query: "What personal attribute does PERSON_A have?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single profile attribute, not aggregation."
  - query: "What habit does PERSON_A have during ACTIVITY_X?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Single habit description, not aggregation."
  - query: "Which technical object is considered core?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System classification relation, not aggregation."
  - query: "What is the first debugging step for SYSTEM_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System procedure query, not subjective aggregation."
query_spec:
  search_mode: "search"
  openviking:
    context_type: "memory"
    target_uri: "viking://memories"
    skip_intent_analysis: true
    typed_query_template:
      intent: "aggregation_summary"
      priority: 1
      target_directories: null
thresholds:
  accept: 0.65
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 25
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
