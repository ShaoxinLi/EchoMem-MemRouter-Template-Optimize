schema_version: "mem-router.backend-route-template.v1"
template_id: "temporal.timeline_fact.v1"
version: "2.1"
status: "enabled"
target:
  primary_backend_id: "temporal_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "timeline_fact_query"
  description: "Queries asking for facts anchored to a specific time, date, month, year, relative date, or event timestamp."
semantic_card: >-
  Use this template only when the user asks when something happened, what happened at a particular time, or which fact is constrained by a time expression and time itself is the core answer. It is NOT for general personal fact lookup without a time anchor, structured relation traversal, preference queries, or direct current-world tool use.
query_prototypes:
  - "When did EVENT_X happen?"
  - "When did PERSON_A do ACTION_X?"
  - "When did PERSON_A start ACTIVITY_X?"
  - "When did PERSON_A finish TASK_X?"
  - "When did PERSON_A leave for PLACE_X?"
  - "When did PERSON_A announce EVENT_X?"
  - "When did PERSON_A meet PERSON_B?"
  - "When did PERSON_A visit PLACE_X?"
  - "When did PERSON_A buy ITEM_X?"
  - "When did PERSON_A adopt PET_X?"
  - "When did PERSON_A move to PLACE_X?"
  - "When did PERSON_A depart for TRIP_X?"
  - "When did PERSON_A begin JOB_X?"
  - "When did PERSON_A lose JOB_X?"
  - "When did PERSON_A join GROUP_X?"
  - "When did PERSON_A resume ACTIVITY_X?"
  - "When did PERSON_A first watch MEDIA_X?"
  - "When did PERSON_A win COMPETITION_X?"
  - "When did PERSON_A make FOOD_X?"
  - "When did PERSON_A see PERFORMANCE_X?"
  - "Which year did PERSON_A adopt PET_X?"
  - "Which month did PERSON_A start ACTIVITY_X?"
  - "Which week did PERSON_A attend EVENT_X?"
  - "On what date did PERSON_A travel to PLACE_X?"
  - "Where was PERSON_A on DATE_X?"
  - "What did PERSON_A do on DATE_X?"
  - "Where did PERSON_A go in MONTH_YEAR_X?"
  - "What happened on DATE_X?"
  - "What event happened during TIME_PERIOD_X?"
  - "When was the last time PERSON_A did ACTION_X?"
  - "When did PERSON_A plan to do ACTION_X?"
  - "When did PERSON_A first do ACTION_X?"
  - "When did PERSON_A get ITEM_X?"
  - "When did PERSON_A share PHOTO_X?"
  - "When did PERSON_A encounter PERSON_B during ACTIVITY_X?"
  - "When did PERSON_A receive ITEM_X from RELATIVE_X?"
  - "When did PERSON_A attend CEREMONY_X?"
  - "When did PERSON_A return from TRIP_X?"
  - "What was PERSON_A doing on DATE_X?"
  - "Where was PHOTO_X taken on DATE_X?"
hard_negatives:
  - query: "What is the link between PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation, not timestamp lookup."
  - query: "Which people are friends with PERSON_A?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Relation list, not temporal fact."
  - query: "What caused EVENT_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Causal reasoning, not timestamp lookup."
  - query: "Which rule blocks duplicate processing?"
    confusing_with_backend: "graph_memory_backend"
    reason: "System dependency, not temporal fact."
  - query: "What reading list belongs to PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact list, not timestamp lookup."
  - query: "Which items did PERSON_A purchase?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Personal fact list, not timestamp lookup."
  - query: "Which preference is associated with PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Preference profile, not temporal fact."
  - query: "What recommendation did you give before?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Previous chat recall, not temporal fact."
  - query: "How many days separated EVENT_A from EVENT_B?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration calculation, not single timestamp."
  - query: "Which event in memory happened earliest?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Sequence reasoning, not single timestamp."
thresholds:
  accept: 0.4
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 40
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
