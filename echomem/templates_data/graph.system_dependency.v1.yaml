schema_version: "mem-router.backend-route-template.v1"
template_id: "graph.system_dependency.v1"
version: "1.0"
status: "enabled"
target:
  primary_backend_id: "graph_memory_backend"
  secondary_backend_ids: []
intent_family:
  name: "system_dependency_graph"
  description: "Technical architecture queries about dependencies, retries, dedupe, rollback, synchronization, rules, metrics, and system interactions."
semantic_card: >-
  Use this template for technical queries where the answer depends on linked system components, rules, dependencies, event flows, or cross-system state rather than a single semantic memory snippet.
query_prototypes:
  - "Which component depends on COMPONENT_X?"
  - "Which field synchronizes SYSTEM_A with SYSTEM_B?"
  - "Which field links SERVICE_A to SERVICE_B?"
  - "Which identifier connects these services?"
  - "Which rule controls BEHAVIOR_X?"
  - "Which rule prevents duplicate processing?"
  - "Which dependency blocks WORKFLOW_X?"
  - "Which dependency creates rollback risk?"
  - "Which service emits EVENT_X for a downstream consumer?"
  - "Which upstream signal drives STATE_X?"
  - "What connects retry behavior to dedupe state?"
  - "Which rule prevents retry double-counting?"
  - "Which system condition creates split-brain dedupe?"
  - "How can TEAM_X detect RULE_X failure?"
  - "How can SYSTEM_X roll back without redeploy?"
  - "Why can METRIC_X look healthy while ISSUE_X remains?"
  - "What should missing IDENTIFIER_X trigger?"
  - "Which rule inflated repeated actions?"
  - "Why are DATE_FIELD_X values shifted?"
  - "How can routing balance be confirmed?"
  - "What explains CONSISTENCY_ISSUE_X?"
  - "Which two identifiers must RECORD_X include?"
  - "Which tags separate SIGNAL_X from RETRY_X?"
  - "How are eligible sessions defined?"
  - "Which state must dedupe preserve during failure?"
  - "Which identifiers anchor RECORD_X?"
  - "What rules govern TAG_X assignment?"
  - "How are sessions marked eligible?"
  - "Which fields must RECORD_X include?"
  - "Which identifiers tie RECORD_X to ENTITY_X?"
  - "What conditions separate valid attempts from invalid attempts?"
  - "How does SYSTEM_X classify retries versus new attempts?"
  - "Which tags distinguish intent from noise?"
  - "What fields survive dedupe across regions?"
  - "Which rules guard against duplicate counts?"
hard_negatives:
  - query: "At what time did PERSON_A buy ITEM_X?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Personal timestamp lookup, not system dependency graph."
  - query: "Which remembered task occurred first?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Temporal order question, not technical dependency."
  - query: "How many days ago did EVENT_X occur?"
    confusing_with_backend: "temporal_memory_backend"
    reason: "Duration lookup, not dependency graph."
  - query: "Which preference belongs to PERSON_A?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Preference memory, not dependency graph."
  - query: "Can you remind me about TOPIC_X from our previous chat?"
    confusing_with_backend: "openviking_memory_backend"
    reason: "Previous chat recall, not technical graph."
  - query: "Which person-to-person relation links PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Entity relation query, not system dependency."
  - query: "Who had a collaboration link with PERSON_A?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Person relation lookup, not technical dependency."
  - query: "Which organization is PERSON_A part of?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Membership relation, not system dependency."
  - query: "Which discussion topic linked PERSON_A and PERSON_B?"
    confusing_with_backend: "graph_memory_backend"
    reason: "Discussion relation, not system dependency."
  - query: "Which technical dependency produced OUTCOME_X?"
    confusing_with_backend: "graph_memory_backend"
    reason: "General causal question, not technical dependency lookup."
thresholds:
  accept: 0.56
  fallback: 0.0
  margin: 0.04
  hard_negative_margin: 0.03
  hard_negative_penalty: 0.06
calibration:
  min_positive_examples: 35
  min_hard_negatives: 10
  expected_fallback_rate: 0.2
